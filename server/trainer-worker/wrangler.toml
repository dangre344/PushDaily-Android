name = "push-daily-trainer"
main = "worker.js"
compatibility_date = "2024-09-23"

# All schedules are free on the Workers plan. scheduled() routes on event.cron.
#    5 0  UTC → generate the day's quiz          (05:35 IST; the broadcasts below retry it)
#    0 4  UTC → push-up event broadcast, morning (09:30 IST)
#   30 13 UTC → push-up event broadcast, evening (19:00 IST)
[triggers]
crons = ["5 0 * * *", "0 4 * * *", "30 13 * * *"]

# Secrets are NOT stored here. Set them with:
#   wrangler secret put GEMINI_KEY
#   wrangler secret put APP_TOKEN
#
# Optional: a free KV namespace for server-side per-device rate limiting.
# (Free plan allows ~1,000 writes/day total — fine for small scale.)
# [[kv_namespaces]]
# binding = "RATE"
# id = "<created via: wrangler kv namespace create RATE>"
