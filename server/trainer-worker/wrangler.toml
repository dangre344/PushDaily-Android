name = "push-daily-trainer"
main = "worker.js"
compatibility_date = "2024-09-23"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put GEMINI_KEY
#   wrangler secret put APP_TOKEN
#
# Optional: a free KV namespace for server-side per-device rate limiting.
# (Free plan allows ~1,000 writes/day total — fine for small scale.)
# [[kv_namespaces]]
# binding = "RATE"
# id = "<created via: wrangler kv namespace create RATE>"
